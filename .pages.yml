content:
  - name: books
    label: Books
    type: file
    path: books.json
    format: json
    fields:
      - {name: title, label: Page title, type: string}
      - {name: updated, label: Last updated, type: string}
      - name: introduction
        label: Introduction and rating guide
        type: text
        description: Plain text and existing HTML are preserved. Keep formatting tags when editing.
      - name: statistics
        label: Statistics
        type: object
        list:
          collapsible: {collapsed: true, summary: "{label}"}
        fields:
          - {name: label, type: string}
          - {name: value, type: string}
      - name: sections
        label: Reading list sections
        type: object
        list:
          collapsible: {collapsed: true, summary: "{label}"}
        fields:
          - {name: id, type: string, readonly: true}
          - {name: label, type: string}
          - name: books
            label: Books
            type: object
            list:
              collapsible: {collapsed: true, summary: "{title}"}
            fields:
              - {name: id, type: string, readonly: true}
              - {name: title, label: Title, type: string}
              - name: metadata
                label: Author, narrator, series and edition
                type: text
                description: Plain text or existing HTML; keep tags to preserve formatting.
              - name: details
                label: Status, rating and dates
                type: object
                list: true
                fields:
                  - name: kind
                    type: select
                    options: {values: [meta, rating, date]}
                  - name: content
                    type: text
                    description: Plain text or existing HTML; keep tags to preserve formatting.
              - {name: summary, label: Summary, type: text}
              - name: notes
                label: My notes
                type: text
                description: Plain text or existing HTML; keep tags to preserve formatting.
              - name: links
                type: object
                list: true
                fields:
                  - {name: label, type: string}
                  - {name: url, type: string}
